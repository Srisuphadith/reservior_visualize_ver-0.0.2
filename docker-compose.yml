services:
  api:
    build: ./backend
    environment:
      RID_API_URL: ${RID_API_URL:-https://app.rid.go.th/reservoir/api/reservoir/public}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-1800}
      RID_TIMEOUT_MS: ${RID_TIMEOUT_MS:-10000}
      API_PORT: ${API_PORT:-3000}
    expose:
      - "${API_PORT:-3000}"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_UPSTREAM: api:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
